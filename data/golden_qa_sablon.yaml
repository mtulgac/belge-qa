  kategori: tek_belge
  dil: tr
  beklenen: yanitla
  kaynak:
    - dosya: tobb_yonetmelik.pdf
      sayfa: 4
      alinti: "en çok dokuz dönemde"
  referans_cevap: "Azami süre dokuz dönemdir."

