# golden_qa.yaml: şema ve örnekler
#
# Bu dosya değerlendirmenin tek referansı. Retrieval, reranking, eşik kapısı
# ve generation hepsi buna karşı ölçülecek.
#
# TASARIM KARARI: cevabın yeri chunk_id ile DEĞİL, dosya + sayfa + alıntı ile
# işaretlenir. Sebep: chunk boyutunu değiştirdiğinde chunk_id'ler kayar
# ve tüm etiketleme bozulur. Alıntı ise chunking'den bağımsız, eval script hangi
# chunk'ın o alıntıyı içerdiğini eşleşmeyle kendisi bulur.
#
# ALANLAR:
#   id            benzersiz kimlik (q001, q002, ...)
#   soru          kullanıcının soracağı doğal dildeki soru
#   kategori      aşağıdaki 8 kategoriden biri
#   dil           tr | en  (sorunun dili)
#   beklenen      yanitla | reddet
#   kaynak        beklenen=yanitla ise: hangi belge(ler), sayfa, çapa alıntı
#                 beklenen=reddet ise: boş (cevap belgede yok)
#   referans_cevap  değerlendirme için doğru cevap (reddet ise reddetme gerekçesi)
#   izole         (opsiyonel) bu soru ölçülürken indeksten düşürülecek belgeler
#   not           (opsiyonel) bu sorunun neyi test ettiği
#
# ============================================================================
# KATEGORİ 1: tek belgeden yanıtlanabilir (9 soru)
# En temel durum. Cevap tek bir pasajda.
# ============================================================================

- id: q001
